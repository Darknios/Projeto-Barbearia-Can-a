<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Canaã Barber</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

</head>

<body>

<div class="container">

<img src="Logo.png" class="logo">

<h1>Agendar Horário</h1>

<p>
Horário de funcionamento de Terça à Domingo a partir 
das 08:00 às 17:00
</p>

<form id="formAgendamento">

<input type="text" name="nome" placeholder="Seu nome" required>

<input type="tel" name="telefone" placeholder="Seu WhatsApp" required>

<select name="servico">

<option value="Corte">Corte</option>
<option value="Barba">Barba</option>
<option value="Corte + Barba">Corte + Barba</option>

</select>

<input type="text" name="data" id="data" placeholder="Escolha a data" required>

<select name="hora" id="hora" required>

<option value="">Escolha um horário</option>

<option value="08:00">08:00</option>
<option value="09:00">09:00</option>
<option value="10:00">10:00</option>
<option value="11:00">11:00</option>
<option value="12:00">12:00</option>
<option value="13:00">13:00</option>
<option value="14:00">14:00</option>
<option value="15:00">15:00</option>
<option value="16:00">16:00</option>
<option value="17:00">17:00</option>

</select>

<button type="submit">Agendar</button>

</form>

</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="script.js"></script>

</body>
</html>
